name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Web export (proves the web bundle builds)
        run: npm run export:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder

  database:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Postgres (applies migrations + seed)
        run: npx supabase db start
      - name: RLS tests (pgTAP, supabase/tests)
        run: npx supabase test db
