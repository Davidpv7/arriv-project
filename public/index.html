<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Arriv is a community for people living in Australia on a visa: crews by city, visa and language, chat, a private document Backpack and your journey as passport stamps."
    />
    <meta name="theme-color" content="#1F2A44" />

    <!-- Link previews (WhatsApp, Messages, LinkedIn, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arriv" />
    <meta property="og:url" content="https://arrivsocial.com/" />
    <meta property="og:title" content="Arriv · Your journey in Australia" />
    <meta
      property="og:description"
      content="Meet people on the same visa path, ask questions and keep your documents safe in one place."
    />
    <meta property="og:image" content="https://arrivsocial.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Arriv: a tangerine postage stamp with a plane, on navy"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arriv · Your journey in Australia" />
    <meta
      name="twitter:description"
      content="Meet people on the same visa path, ask questions and keep your documents safe in one place."
    />
    <meta name="twitter:image" content="https://arrivsocial.com/og-image.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #f7f0e1;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Arriv.</noscript>
    <div id="root"></div>
  </body>
</html>
